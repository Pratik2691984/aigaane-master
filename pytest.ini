[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    scripts/migrations/archive
    tests/_orphaned
    .git
    .pytest_cache
    __pycache__
    archives
    experimental_logs
    future-labs
    node_modules
    .firebase
    .vercel
    .vscode
filterwarnings =
    ignore::DeprecationWarning:google.genai.*