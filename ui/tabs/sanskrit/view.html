<div class="tab-container sanskrit-tab">
    <header class="varga-header">
        <h2>Mātṛkā Phonetic Engine</h2>
        <p id="active-varga-name">All Vargas</p>
    </header>

    <div class="sanskrit-layout">
        <div class="akshara-grid" id="matrikaGrid"></div>

        <aside class="phoneme-info">
            <div class="focus-card">
                <span class="label">Current Akshara</span>
                <div id="bigAkshara" class="display-glyph">अ</div>
            </div>
            <div class="data-list">
                <div class="data-item">
                    <span>Transliteration</span>
                    <strong id="translitValue">a</strong>
                </div>
                <div class="data-item">
                    <span>Varga Group</span>
                    <strong id="vargaValue">Svara</strong>
                </div>
                <div class="data-item">
                    <span>Phoneme ID</span>
                    <strong id="phonemeIdValue">0</strong>
                </div>
            </div>
        </aside>
    </div>

    <section class="corpus-browser" id="corpusBrowser" data-readonly="true">
        <div class="corpus-banner" id="corpusBanner">[PREVIEW MODE — 45 / 2000 RECORDS LOADED — READ ONLY]</div>
        <nav class="corpus-subnav" aria-label="Corpus browser">
            <button type="button" class="corpus-tab active" data-corpus-view="dhatu">Dhātu</button>
            <button type="button" class="corpus-tab" data-corpus-view="sutra">Sūtra</button>
            <button type="button" class="corpus-tab" data-corpus-view="stotra">Stotra</button>
            <button type="button" class="corpus-tab" data-corpus-view="search">Search</button>
            <button type="button" class="corpus-tab" data-corpus-view="trace">Trace</button>
            <button type="button" class="corpus-tab" data-corpus-view="preview">Preview</button>
        </nav>
        <div id="corpusSearchWrap" class="corpus-search-wrap" hidden>
            <label for="corpusSearch">Search</label>
            <input id="corpusSearch" type="search" placeholder="root, text, title, transliteration" autocomplete="off">
        </div>
        <div id="corpusPanel" class="corpus-panel"></div>
    </section>
</div>
