<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jyotirlinga Acoustic Nodes · Aigaane</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        /* Add specific studio styles here */
        .node-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 2rem; }
        .node-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .node-card:hover, .node-card.active { border-color: var(--gold-primary); transform: translateY(-2px); }
        .visualizer-canvas { width: 100%; height: 300px; background: #000; border-radius: 8px; margin-top: 1rem; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand"><a href="/index.html" style="color: var(--gold-primary); text-decoration: none;">ॐ Aigaane</a></div>
        <nav class="nav-links"><a href="/cabinet.html" class="nav-item">← Cabinet</a></nav>
    </header>

    <main class="container">
        <h1 style="color: var(--gold-primary);">Jyotirlinga Acoustic Nodes</h1>
        <p class="subtitle">Topological Fluidic-Acoustic Supercluster • 12 Sacred Nodes</p>

        <div class="node-grid" id="nodeGrid">
            <!-- Nodes injected via JS -->
        </div>

        <div style="margin-top: 2rem;">
            <h3 style="color: var(--text-main);">Active Node: <span id="activeNodeName" style="color: var(--gold-primary);">Somnath</span></h3>
            <canvas id="acousticVisualizer" class="visualizer-canvas"></canvas>
            <div style="margin-top: 1rem; display: flex; gap: 1rem;">
                <button id="playBtn" class="btn-action" style="background: var(--gold-primary); color: #000; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">▶ Fire Bindu Pulse</button>
                <button id="stopBtn" class="btn-outline" style="padding: 10px 20px; border: 1px solid var(--gold-primary); background: transparent; color: var(--gold-primary); border-radius: 6px; cursor: pointer;">⏹ Stop</button>
            </div>
        </div>
    </main>

    <script src="/js/jyotirlinga_agent.js"></script>
</body>
</html>
