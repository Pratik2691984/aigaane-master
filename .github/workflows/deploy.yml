name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 1. Pytest Contract & API Battery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx
          python -c "import vidyut; vidyut.download_data('./data/vidyut')" || true

      - name: Run Test Battery (356 tests)
        env:
          AIGAANE_ENGINE_MODULE: engine
          PYTHONPATH: .
        run: |
          python -m pytest tests/contract tests/api -v -p no:cacheprovider --rootdir=.

  deploy-api:
    name: 2. Cloud Run Backend Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Container via Cloud Build
        run: |
          gcloud builds submit --tag asia-south1-docker.pkg.dev/gen-lang-client-0991678000/cloud-run-source-deploy/aigaane-api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy aigaane-api \
            --image asia-south1-docker.pkg.dev/gen-lang-client-0991678000/cloud-run-source-deploy/aigaane-api:${{ github.sha }} \
            --region asia-south1 \
            --allow-unauthenticated \
            --quiet

  deploy-frontend:
    name: 3. Firebase Hosting Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Frontend Artifacts
        run: |
          cp -f frontend/index.html frontend/public/index.html
          cp -f frontend/css/engine.css frontend/public/css/engine.css

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: gen-lang-client-0991678000
          channelId: live
